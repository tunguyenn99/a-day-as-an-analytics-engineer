apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
  - name: Warehouse
    uid: warehouse
    type: postgres
    url: $PGHOST:$PGPORT
    user: $PGUSER
    jsonData:
      database: $PGDATABASE
      sslmode: $PGSSLMODE
      postgresVersion: 1600
    secureJsonData:
      password: $PGPASSWORD
