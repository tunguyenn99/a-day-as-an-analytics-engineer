analytics_engineering:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev: &postgres
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PGUSER', 'postgres') }}"
      password: "{{ env_var('PGPASSWORD', 'local-only') }}"
      dbname: "{{ env_var('PGDATABASE', 'postgres') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'analytics') }}"
      sslmode: "{{ env_var('PGSSLMODE', 'disable') }}"
      threads: 4
    prod:
      <<: *postgres
