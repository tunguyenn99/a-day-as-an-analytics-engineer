version: 2
models:
- name: fct_orders
  description: 'Commerce fact: one order; header revenue is never summed after joining
    item-level rows.'
  columns:
  - name: order_id
    description: Order identifier from the source.
    tests:
    - unique
    - not_null
    meta:
      openmetadata:
        glossary:
        - WebAnalytics.Order
  - name: ordered_at
    description: Timestamp the order was placed.
  - name: order_date
    description: Calendar date the order was placed.
    tests:
    - not_null
  - name: website_session_id
    description: Website session identifier from the source.
    tests:
    - not_null
    - relationships:
        to: ref('fct_sessions')
        field: website_session_id
  - name: user_id
    description: Customer who placed the order.
    tests:
    - not_null
    - relationships:
        to: ref('dim_customer')
        field: user_id
    meta:
      openmetadata:
        tags:
        - Sensitivity.Confidential
  - name: primary_product_id
    description: Primary product of the order; equals product_id of the line with
      is_primary_item = 1.
    tests:
    - not_null
    - relationships:
        to: ref('dim_product')
        field: product_id
  - name: items_purchased
    description: Number of order lines (units) in the order.
  - name: gross_revenue_usd
    description: Order total in USD before refunds (source price_usd).
    tests:
    - not_null
    - non_negative
    meta:
      openmetadata:
        glossary:
        - WebAnalytics.GrossRevenue
  - name: cogs_usd
    description: Order cost of goods sold in USD.
    tests:
    - not_null
    - non_negative
  config:
    meta:
      domain: commerce
      owner: analytics-engineering
      openmetadata:
        domain: Commerce
        tier: Tier.Tier2
